<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Blade & Buddy - 3D Action Prototype</title>
  <meta name="theme-color" content="#0a0c16">
  <!-- PWA & iOS Safari 全画面設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Blade&Buddy">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="alternate icon" href="icon-192.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Three.js CDN & GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <!-- 3Dレンダリング用コンテナ -->
  <div id="game-container"></div>

  <!-- HUD・ゲームUIレイヤー -->
  <div id="ui-layer">
    <!-- ヘッダー情報 (バディ・討伐数・コイン) -->
    <header class="hud-header">
      <div class="hud-card buddy-card">
        <span class="hud-icon">🧚</span>
        <div class="hud-data">
          <span class="hud-label">BUDDY</span>
          <span id="buddy-status" class="hud-value buddy-active">AUTO SUPPORT</span>
        </div>
      </div>
      <div class="hud-card kills-card">
        <span class="hud-icon">⚔️</span>
        <div class="hud-data">
          <span class="hud-label">KILLS</span>
          <span id="kill-count" class="hud-value">0</span>
        </div>
      </div>
      <div class="hud-card coins-card">
        <span class="hud-icon">🪙</span>
        <div class="hud-data">
          <span class="hud-label">COINS</span>
          <span id="coin-count" class="hud-value">0</span>
        </div>
      </div>
      <!-- ショップオープンボタン -->
      <button id="btn-open-shop" class="hud-card shop-btn" aria-label="ショップを開く">
        <span class="hud-icon">🛍️</span>
        <div class="hud-data">
          <span class="hud-label">STORE</span>
          <span class="hud-value shop-btn-text">SHOP</span>
        </div>
      </button>
    </header>

    <!-- ショップ & 着せ替えモーダル -->
    <div id="shop-modal" class="shop-modal hidden">
      <div class="shop-backdrop" id="shop-backdrop"></div>
      <div class="shop-panel">
        <div class="shop-header">
          <div class="shop-title-group">
            <h2 class="shop-title">CYBER SHOP & CUSTOMIZE</h2>
            <p class="shop-subtitle">コインを使って見た目や刀を強化・着せ替え</p>
          </div>
          <div class="shop-header-right">
            <div class="shop-coin-badge">
              <span class="coin-icon">🪙</span>
              <span id="shop-coin-display" class="coin-val">0</span>
            </div>
            <button id="btn-close-shop" class="shop-close-btn" aria-label="ショップを閉じる">✕</button>
          </div>
        </div>

        <!-- タブナビゲーション -->
        <nav class="shop-tabs">
          <button class="shop-tab active" data-tab="outfit">
            <span class="tab-icon">🥋</span>
            <span class="tab-label">衣装カラー</span>
          </button>
          <button class="shop-tab" data-tab="head">
            <span class="tab-icon">👑</span>
            <span class="tab-label">頭装備</span>
          </button>
          <button class="shop-tab" data-tab="sword">
            <span class="tab-icon">⚔️</span>
            <span class="tab-label">刀スキン & 属性</span>
          </button>
          <button class="shop-tab" data-tab="pet">
            <span class="tab-icon">🐾</span>
            <span class="tab-label">ペット (最大3体)</span>
          </button>
        </nav>

        <!-- アイテムリストコンテナ -->
        <div class="shop-content">
          <div id="shop-items-grid" class="shop-items-grid">
            <!-- JavaScriptで動的生成 -->
          </div>
        </div>

        <div class="shop-footer">
          <span class="shop-footer-tip">💡 装備したアイテムは自動的にゲームに反映・保存されます</span>
        </div>
      </div>
    </div>

    <!-- 操作ガイド (PC・タブレット両対応通知) -->
    <div id="guide-tip" class="guide-tip">
      <span>🕹️ 左下: 移動 / ⚔️ 右下: 攻撃 / 🧚 ペットが3秒毎に自動魔法援護！</span>
    </div>

    <!-- iPad/スマホ用タッチコントローラー -->
    <div id="controls-container">
      <!-- 左下: バーチャルジョイスティック -->
      <div id="joystick-zone">
        <div id="joystick-base">
          <div id="joystick-knob"></div>
        </div>
      </div>

      <!-- 右下: 攻撃ボタン -->
      <div id="action-zone">
        <button id="btn-attack" aria-label="攻撃" class="action-btn">
          <span class="btn-inner">
            <svg class="sword-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"></polyline>
              <line x1="13" y1="19" x2="19" y2="13"></line>
              <line x1="16" y1="16" x2="20" y2="20"></line>
              <line x1="19" y1="21" x2="21" y2="19"></line>
            </svg>
            <span class="btn-text">ATTACK</span>
          </span>
          <span class="btn-ripple"></span>
        </button>
      </div>
    </div>
  </div>

  <script src="main.js"></script>

  <!-- PWA Service Worker 登録スクリプト -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('[PWA] Service Worker registered successfully:', reg.scope))
          .catch((err) => console.warn('[PWA] Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
