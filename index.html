<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  
  <!-- iOS PWA Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Blade&Buddy">
  
  <title>Blade & Buddy - 3D Action RPG</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  
  <link rel="stylesheet" href="style.css">
  <!-- Three.js (r128) & GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <!-- 3Dゲーム画面コンテナ -->
  <div id="game-container"></div>

  <!-- 被弾時の画面赤フラッシュオーバーレイ -->
  <div id="damage-overlay" class="damage-overlay"></div>

  <!-- UIレイヤー -->
  <div id="ui-layer">
    <!-- ヘッダー（HP/MPバー、ボスバー、キル数、コイン、ショップ、サウンド） -->
    <header class="game-header">
      <!-- プレイヤーHP / MPステータス -->
      <div class="player-status-card">
        <div class="status-row hp-row">
          <span class="status-label">❤️ HP</span>
          <div class="bar-container">
            <div id="player-hp-damage-bar" class="bar-damage"></div>
            <div id="player-hp-bar" class="bar-fill hp-fill" style="width: 100%;"></div>
          </div>
          <span id="player-hp-text" class="status-val">100/100</span>
        </div>
        <div class="status-row mp-row">
          <span class="status-label">🔮 MP</span>
          <div class="bar-container">
            <div id="player-mp-bar" class="bar-fill mp-fill" style="width: 100%;"></div>
          </div>
          <span id="player-mp-text" class="status-val">100/100</span>
        </div>
      </div>

      <!-- ボスHPバー（ボス出現時のみ表示） -->
      <div id="boss-hp-container" class="boss-hp-container hidden">
        <div class="boss-header-row">
          <span id="boss-name" class="boss-name">👑 KING GOBLIN</span>
          <div class="boss-affinity-badges">
            <span id="boss-weak-badge" class="affinity-badge weak">弱点: ❄️氷</span>
            <span id="boss-resist-badge" class="affinity-badge resist">耐性: 💥爆発</span>
          </div>
        </div>
        <div class="boss-bar-frame">
          <div id="boss-hp-damage-bar" class="boss-bar-damage"></div>
          <div id="boss-hp-bar" class="boss-bar-fill" style="width: 100%;"></div>
        </div>
      </div>

      <!-- 右側コントロール（スコア・コイン・ショップ・BGM） -->
      <div class="stats-container">
        <div class="stat-card kills-card">
          <span class="stat-icon">💀</span>
          <span class="stat-label">KILLS</span>
          <span id="kill-count" class="stat-value">0</span>
        </div>
        <div class="stat-card coins-card">
          <span class="stat-icon">🪙</span>
          <span class="stat-label">COINS</span>
          <span id="coin-count" class="stat-value">0</span>
        </div>
        <button id="btn-open-shop" class="shop-btn" aria-label="ショップを開く">
          <span class="shop-icon">🛒</span>
          <span class="shop-text">SHOP</span>
        </button>
        <button id="btn-toggle-sound" class="sound-btn" aria-label="サウンド切り替え">
          <span id="sound-icon" class="sound-icon">🎵</span>
          <span id="sound-status-text" class="sound-text">BGM ON</span>
        </button>
      </div>
    </header>

    <!-- 仮想ジョイスティック（移動操作：画面左下） -->
    <div id="joystick-zone" class="joystick-zone">
      <div id="joystick-base" class="joystick-base">
        <div id="joystick-knob" class="joystick-knob"></div>
      </div>
    </div>

    <!-- 5大属性魔法クイックスロットパレット（画面右下・攻撃ボタン周辺） -->
    <div id="magic-palette" class="magic-palette">
      <button id="btn-magic-explosion" class="magic-btn btn-explosion" data-magic="explosion" aria-label="爆発魔法">
        <span class="magic-icon">💥</span>
        <span class="magic-level-tag" id="tag-level-explosion">Lv.1</span>
        <span class="magic-cost-tag">30MP</span>
        <span class="key-hint">Q/1</span>
      </button>
      <button id="btn-magic-flame" class="magic-btn btn-flame" data-magic="flame" aria-label="炎魔法">
        <span class="magic-icon">🔥</span>
        <span class="magic-level-tag" id="tag-level-flame">Lv.1</span>
        <span class="magic-cost-tag">20MP</span>
        <span class="key-hint">E/2</span>
      </button>
      <button id="btn-magic-ice" class="magic-btn btn-ice" data-magic="ice" aria-label="氷魔法">
        <span class="magic-icon">❄️</span>
        <span class="magic-level-tag" id="tag-level-ice">Lv.1</span>
        <span class="magic-cost-tag">25MP</span>
        <span class="key-hint">R/3</span>
      </button>
      <button id="btn-magic-wind" class="magic-btn btn-wind" data-magic="wind" aria-label="風魔法">
        <span class="magic-icon">🌪️</span>
        <span class="magic-level-tag" id="tag-level-wind">Lv.1</span>
        <span class="magic-cost-tag">20MP</span>
        <span class="key-hint">F/4</span>
      </button>
      <button id="btn-magic-thunder" class="magic-btn btn-thunder" data-magic="thunder" aria-label="雷魔法">
        <span class="magic-icon">⚡</span>
        <span class="magic-level-tag" id="tag-level-thunder">Lv.1</span>
        <span class="magic-cost-tag">25MP</span>
        <span class="key-hint">C/5</span>
      </button>
    </div>

    <!-- 攻撃ボタン（画面右下） -->
    <div id="action-zone" class="action-zone">
      <button id="btn-attack" class="attack-btn" aria-label="斬撃攻撃">
        <span class="attack-icon">⚔️</span>
        <span class="attack-label">SLASH</span>
        <span class="key-hint-space">SPACE</span>
      </button>
    </div>
  </div>

  <!-- ショップモーダル -->
  <div id="shop-modal" class="shop-modal hidden">
    <div class="shop-backdrop" id="shop-backdrop"></div>
    <div class="shop-content">
      <div class="shop-header">
        <div class="shop-title-area">
          <span class="shop-title-icon">🏰</span>
          <h2>ダンジョン魔導商店 & スキン工房</h2>
        </div>
        <div class="shop-coin-badge">
          <span>所持コイン: 🪙</span>
          <span id="shop-coin-display">0</span>
        </div>
        <button id="btn-close-shop" class="close-btn" aria-label="閉じる">✕</button>
      </div>

      <!-- タブ切り替え（衣装・頭装備・刀・ペット・魔法強化） -->
      <div class="shop-tabs">
        <button class="shop-tab active" data-tab="magic">🔮 魔法強化</button>
        <button class="shop-tab" data-tab="outfit">🛡️ アーマー衣装</button>
        <button class="shop-tab" data-tab="head">👤 頭部装備</button>
        <button class="shop-tab" data-tab="sword">🗡️ 刀スキン&属性</button>
        <button class="shop-tab" data-tab="pet">🧚 バディペット</button>
      </div>

      <!-- アイテム・魔法一覧グリッド -->
      <div id="shop-items-grid" class="shop-items-grid"></div>
    </div>
  </div>

  <!-- GAME OVER モーダル -->
  <div id="gameover-modal" class="gameover-modal hidden">
    <div class="gameover-backdrop"></div>
    <div class="gameover-card">
      <div class="gameover-skull">💀</div>
      <h2 class="gameover-title">YOU DIED</h2>
      <p class="gameover-sub">ダンジョンの闇に呑み込まれた…</p>

      <div class="gameover-stats">
        <div class="go-stat-row">
          <span>討伐モンスター数:</span>
          <strong id="go-kills">0</strong>
        </div>
        <div class="go-stat-row">
          <span>総獲得コイン:</span>
          <strong id="go-coins">0 🪙</strong>
        </div>
      </div>

      <button id="btn-retry" class="btn-retry">
        <span>⚔️ 復活して再挑戦 (REVIVE)</span>
      </button>
    </div>
  </div>

  <script src="main.js"></script>
  <script>
    // Service Worker Registration for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('[PWA] Service Worker registered successfully:', reg.scope))
          .catch(err => console.warn('[PWA] Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
