<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景グラデーション -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    
    <!-- 刀身シアンネオングラデーション -->
    <linearGradient id="bladeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- 刀身グロー -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- バディピンクグロー -->
    <filter id="pinkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 背景ベース -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.5" />

  <!-- 背景サイバーグリッドライン -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.15">
    <circle cx="256" cy="256" r="180" fill="none" stroke-dasharray="8 6" />
    <circle cx="256" cy="256" r="130" fill="none" />
    <line x1="256" y1="40" x2="256" y2="472" />
    <line x1="40" y1="256" x2="472" y2="256" />
  </g>

  <!-- 斬撃エフェクト (アーク) -->
  <path d="M 120 390 A 200 200 0 0 1 390 120" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" filter="url(#neonGlow)" opacity="0.85" />
  <path d="M 140 370 A 170 170 0 0 1 370 140" fill="none" stroke="#f472b6" stroke-width="8" stroke-linecap="round" filter="url(#pinkGlow)" opacity="0.6" />

  <!-- 刀 (Katana) -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)" filter="url(#neonGlow)">
    <!-- 刀身 -->
    <path d="M 248 70 L 264 70 L 260 360 L 252 360 Z" fill="url(#bladeGrad)" />
    <!-- 切先 (先端) -->
    <path d="M 248 70 Q 256 40 264 70 Z" fill="#ffffff" />
    <!-- 刃先ハイライト -->
    <line x1="256" y1="50" x2="256" y2="350" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    
    <!-- 鍔 (ガード) -->
    <rect x="232" y="358" width="48" height="12" rx="4" fill="#fbbf24" stroke="#f59e0b" stroke-width="2" />
    
    <!-- 柄 (つか) -->
    <rect x="246" y="370" width="20" height="90" rx="4" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
    <!-- 柄巻きパターン -->
    <line x1="246" y1="385" x2="266" y2="395" stroke="#f43f5e" stroke-width="3" />
    <line x1="246" y1="405" x2="266" y2="415" stroke="#f43f5e" stroke-width="3" />
    <line x1="246" y1="425" x2="266" y2="435" stroke="#f43f5e" stroke-width="3" />
    <line x1="246" y1="445" x2="266" y2="455" stroke="#f43f5e" stroke-width="3" />
  </g>

  <!-- バディ精霊 (Buddy Fairy) -->
  <g transform="translate(370, 160)" filter="url(#pinkGlow)">
    <!-- 翼 -->
    <path d="M -5 -5 C -35 -30 -35 15 -5 5 Z" fill="#38bdf8" opacity="0.8" />
    <path d="M 5 -5 C 35 -30 35 15 5 5 Z" fill="#38bdf8" opacity="0.8" />
    <!-- 耳 -->
    <polygon points="-12,-16 -18,-38 -4,-22" fill="#f472b6" />
    <polygon points="12,-16 18,-38 4,-22" fill="#f472b6" />
    <!-- 体 -->
    <circle cx="0" cy="0" r="26" fill="#ffffff" stroke="#f472b6" stroke-width="3" />
    <!-- 目 -->
    <circle cx="-8" cy="-3" r="4.5" fill="#0f172a" />
    <circle cx="8" cy="-3" r="4.5" fill="#0f172a" />
    <circle cx="-7" cy="-5" r="1.5" fill="#ffffff" />
    <circle cx="9" cy="-5" r="1.5" fill="#ffffff" />
    <!-- ほっぺ -->
    <circle cx="-13" cy="6" r="4" fill="#fb7185" opacity="0.7" />
    <circle cx="13" cy="6" r="4" fill="#fb7185" opacity="0.7" />
    <!-- オーラリング -->
    <ellipse cx="0" cy="0" rx="34" ry="12" fill="none" stroke="#fde047" stroke-width="3" opacity="0.8" />
  </g>
</svg>
